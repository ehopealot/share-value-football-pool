name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=5
      - run: npm run typecheck
      - name: Check committed diff
        run: |
          if git rev-parse --verify HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

  e2e:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run full end-to-end suite
        run: npm run test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check deployment freshness
        id: freshness
        run: |
          set -o pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          git config --local --unset-all http.https://github.com/.extraheader
          if [ "$GITHUB_SHA" = "$remote_main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale commit $GITHUB_SHA; main is $remote_main"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Verify production artifacts before migration
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CI: "true"
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          npm run build:production
          npm run build:local
          npm run verify:production-artifact
      - name: Apply D1 migrations
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy production Worker
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run deploy:production
      - name: Verify production health
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out "%{http_code}" https://officepool.football/health/app || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            echo "Health check attempt $attempt returned ${status:-no response}; retrying"
            sleep 5
          done
          echo "Production health check did not return HTTP 200"
          exit 1
